name: CI

on:
  push:
  pull_request:

jobs:
  frontend-format:
    name: Check Frontend Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@12.4.2 --activate

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Install prettier
        working-directory: ./frontend
        run: pnpm add -Dw prettier

      - name: Check formatting with prettier
        working-directory: ./frontend
        run: pnpm exec prettier --check app

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@12.4.2 --activate

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm build

  backend-ssh-tests:
    name: Test backend and storage setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libvirt-dev pkg-config
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - run: PYTHONPATH=backend pytest backend/tests -q
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
      - run: python -m unittest discover -s host/tests -v

  backend-format:
    name: Check Backend Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install autopep8
        run: pip install autopep8

      - name: Check formatting with autopep8
        working-directory: ./backend
        run: |
          autopep8 --diff --recursive --select=E,W app/ > /tmp/autopep8.diff || true
          if [ -s /tmp/autopep8.diff ]; then
            echo "Code formatting issues found. Please run: autopep8 --in-place --recursive --select=E,W app/"
            cat /tmp/autopep8.diff
            exit 1
          fi
