services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-stage
    container_name: distribox-backend
    restart: unless-stopped
    environment:
      - DISTRIBOX_MODE=${DISTRIBOX_MODE:-master}
      - POSTGRES_HOST=${POSTGRES_HOST:-database}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_NAME=${POSTGRES_NAME:-distribox}
      - POSTGRES_USER=${POSTGRES_USER:-distribox_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-distribox_password}
      - BACKEND_PORT=${BACKEND_PORT:-8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ROOT_PATH=${ROOT_PATH:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - SSH_ENABLED=${SSH_ENABLED:-false}
      - SSH_PORT=${SSH_PORT:-2222}
      - SSH_PUBLIC_HOST=${SSH_PUBLIC_HOST:-}
      - SSH_PUBLIC_PORT=${SSH_PUBLIC_PORT:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - DISTRIBOX_SECRET=${DISTRIBOX_SECRET:-secret}
      - DISTRIBOX_BUCKET_REGISTRY=${DISTRIBOX_BUCKET_REGISTRY:-distribox-registry}
      - AWS_REGION=${AWS_REGION:-eu-west-3}
      - VNC_HOST=${VNC_HOST:-127.0.0.1}
      - VIRT_TYPE=${VIRT_TYPE:-kvm}
    network_mode: host
    extra_hosts:
      - "database:127.0.0.1"
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      - /var/lib/distribox:/var/lib/distribox
    depends_on:
      database:
        condition: service_healthy
    profiles: ["master"]


  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-stage
    container_name: distribox-backend-dev
    environment:
      - DISTRIBOX_SECRET=${DISTRIBOX_SECRET:-secret}
      - POSTGRES_HOST=${POSTGRES_HOST:-database}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_NAME=${POSTGRES_NAME:-distribox}
      - POSTGRES_USER=${POSTGRES_USER:-distribox_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-distribox_password}
      - BACKEND_PORT=${BACKEND_PORT:-8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - SSH_ENABLED=${SSH_ENABLED:-false}
      - SSH_PORT=${SSH_PORT:-2222}
      - SSH_PUBLIC_HOST=${SSH_PUBLIC_HOST:-}
      - SSH_PUBLIC_PORT=${SSH_PUBLIC_PORT:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - DISTRIBOX_BUCKET_REGISTRY=${DISTRIBOX_BUCKET_REGISTRY:-distribox-registry}
      - AWS_REGION=${AWS_REGION:-eu-west-3}
      - VNC_HOST=${VNC_HOST:-127.0.0.1}
      - VIRT_TYPE=${VIRT_TYPE:-kvm}
    network_mode: host
    extra_hosts:
      - "database:127.0.0.1"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/code/app
      - ./.env:/code/.env
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      - /var/lib/distribox:/var/lib/distribox
    depends_on:
      database:
        condition: service_healthy
    profiles: ["dev"]


  slave:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-stage
    container_name: distribox-slave
    restart: unless-stopped
    environment:
      - DISTRIBOX_MODE=slave
      - POSTGRES_HOST=${POSTGRES_HOST:-database}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_NAME=${POSTGRES_NAME:-distribox}
      - POSTGRES_USER=${POSTGRES_USER:-distribox_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-distribox_password}
      - BACKEND_PORT=${SLAVE_PORT:-8081}
      - MASTER_URL=${MASTER_URL:-http://127.0.0.1:8080}
      - SLAVE_API_KEY=${SLAVE_API_KEY:-}
      - DISTRIBOX_SECRET=${DISTRIBOX_SECRET:-secret}
      - DISTRIBOX_BUCKET_REGISTRY=${DISTRIBOX_BUCKET_REGISTRY:-distribox-registry}
      - AWS_REGION=${AWS_REGION:-eu-west-3}
      - VNC_HOST=${VNC_HOST:-127.0.0.1}
      - VNC_LISTEN=${VNC_LISTEN:-127.0.0.1}
      - VIRT_TYPE=${VIRT_TYPE:-kvm}
    network_mode: host
    extra_hosts:
      - "database:127.0.0.1"
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      - /var/lib/distribox:/var/lib/distribox
    depends_on:
      database:
        condition: service_healthy
    profiles: ["slave"]


volumes:
  backend:

networks:
  distribox-network:
    name: distribox-network
